# ============================================================
# CONFIGURAÇÃO PADRÃO - DEVELOPMENT (localhost)
# Para usar PRODUÇÃO (100.126.166.63):
#   java -Dspring.profiles.active=prod -jar target/spdealer-1.0.0.jar --server.port=8080
# Para usar DESENVOLVIMENTO (localhost):
#   java -Dspring.profiles.active=dev -jar target/spdealer-1.0.0.jar --server.port=8080
# Ou use variável de ambiente:
#   $env:SPRING_PROFILES_ACTIVE='dev'; java -jar target/spdealer-1.0.0.jar
# ============================================================

# Profile ativo (dev = padrão, prod = produção)
spring.profiles.active=dev

spring.datasource.url=jdbc:mariadb://100.126.166.63:3306/erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=k15720
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Otimizacoes de startup (desenvolvimento)
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_sql_comments=false

# HikariCP Connection Pool - CRÍTICO PARA VAZAMENTO DE CONEXÕES
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# CORS Configuration - lê de variáveis de ambiente
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://100.126.166.63:3000,http://100.126.166.63:8080,http://192.168.10.100:3000,http://192.168.10.100:8080}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

# Frontend URL (para redirects/links)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
############################################################
# SPRING BOOT ACTUATOR - Expor apenas health e info
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never
management.endpoint.info.enabled=true
############################################################
# Garantir que Actuator não seja sobrescrito pelo React
spring.web.resources.add-mappings=true
spring.mvc.servlet.path=/
spring.thymeleaf.mode=HTML

# Desabilitar Flyway em desenvolvimento (causa delay de 5 minutos no startup)
spring.flyway.enabled=false

logging.level.root=WARN
logging.level.org.springframework.web=ERROR
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.engine.transaction.internal=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.boot.autoconfigure.web=ERROR
logging.level.org.springframework.web.servlet=ERROR
logging.level.org.springframework.web.filter=ERROR
logging.level.org.springframework.web.context=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
