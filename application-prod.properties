# ============================================
# APPLICATION-PROD.PROPERTIES
# SPDealer - Configuração Produção
# ============================================

# ===== SERVER =====
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# ===== DATABASE =====
spring.datasource.url=jdbc:mariadb://100.126.166.63:3306/erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=k15720
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ===== JPA/HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===== LOGGING =====
logging.level.root=INFO
logging.level.br.com.spdealer=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.file.name=/opt/spdealer/data/logs/backend.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===== ACTUATOR (Health Check) =====
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.diskspace.enabled=true

# ===== PERFORMANCE =====
spring.threads.virtual.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===== JACKSON (JSON) =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===== SECURITY =====
# Descomente se usar Spring Security em produção
# spring.security.require-ssl=true
# server.ssl.key-store=file:${SSL_KEY_STORE_PATH}
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12

# ===== APPLICATION INFO =====
spring.application.name=SPDealer
app.version=1.0.0
app.environment=production

# ===== NFE / SEFAZ CONFIG =====
nfe.certificado.path=/usr/local/tomcat10/certificado.pfx
nfe.certificado.senha=12345678

