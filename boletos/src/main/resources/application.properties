# Configuracao do SPR Boleto API
spring.application.name=spr-boleto

# Configuracao do Banco de Dados MariaDB (erp - spdealer)
spring.datasource.url=jdbc:mariadb://100.126.166.63:3306/erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=k15720
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracao do Hibernate (DDL none - tabela ja existe)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuracao de precisao decimal para valores grandes
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.order_inserts=true

# Server context path
server.servlet.context-path=/

# error details
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

