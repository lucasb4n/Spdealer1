# ============================================================================
# NGINX Virtual Hosts Configuration - SPDealer Production
# Servidor: 192.168.10.30
# Porta: 80 (HTTP) e 443 (HTTPS com certificado)
# ============================================================================

# ============================================================================
# Upstream Backends
# ============================================================================

upstream spdealer_backend {
    # Spring Boot Backend rodando em localhost:8080
    server 192.168.10.70:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream spdealer_frontend {
    # React Frontend rodando em localhost:3000
    server 192.168.10.70:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream spdealer_socket {
    # Node.js Socket Server rodando em localhost:5000
    server localhost:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ============================================================================
# HTTP Redirect to HTTPS (Security)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name spdealer.com www.spdealer.com 192.168.10.30;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================================================
# HTTPS Main Server (Primary vhost)
# ============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spdealer.com www.spdealer.com 192.168.10.30;

    # SSL Configuration
    ssl_certificate /root/Servidor/certificado/spdealer.crt;
    ssl_certificate_key /root/Servidor/certificado/spdealer.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/spdealer_access.log combined;
    error_log /var/log/nginx/spdealer_error.log warn;

    # Root directory (for static files, if any)
    root /var/www/spdealer;

    # Client upload limit
    client_max_body_size 50M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ========================================================================
    # Frontend (React) - Root Path
    # ========================================================================

    location / {
        # Proxy to React Frontend (Port 3000)
        proxy_pass http://spdealer_frontend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Cache control for development
        proxy_cache_bypass $http_upgrade;
    }

    # ========================================================================
    # Backend API - /api paths
    # ========================================================================

    location ~ ^/api/ {
        # Proxy to Spring Boot Backend (Port 8080)
        proxy_pass http://spdealer_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keep connections alive
        proxy_set_header Connection "";

        # Redirect rules for /api paths
        proxy_redirect http://localhost:8080/api/ https://$server_name/api/;
        proxy_redirect http://192.168.10.70:8080/api/ https://$server_name/api/;
    }

    # ========================================================================
    # Socket.IO Server - Real-time Communication
    # ========================================================================

    location /socket.io/ {
        # Proxy to Socket.IO Server (Port 5000)
        proxy_pass http://spdealer_socket;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO specific
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ========================================================================
    # Health Check Endpoint
    # ========================================================================

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ========================================================================
    # Static Assets (Caching)
    # ========================================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========================================================================
    # Deny access to sensitive files
    # ========================================================================

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.well-known {
        allow all;
    }

}

# ============================================================================
# IPv6 Support (Optional)
# ============================================================================

# Already included in main server block with [::]:443 and [::]:80

# ============================================================================
# Gzip Compression
# ============================================================================

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
gzip_disable "msie6";

# ============================================================================
# Rate Limiting (DDoS Protection)
# ============================================================================

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Aplicar limites nas locations específicas:
# limit_req zone=general burst=20 nodelay;
# limit_req zone=api burst=100 nodelay;
# limit_req zone=login burst=5 nodelay;
