<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Notice the use of  in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  <script defer src="/static/js/bundle.js"></script></head>
  <body>
    <!-- Console Overlay Debug -->
    <div id="console-overlay" style="position: fixed; bottom: 10px; right: 10px; width: 400px; height: 200px; background: #222; color: #0f0; border: 1px solid #0f0; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 11px; overflow-y: auto; z-index: 9999; display: block;"></div>
    <button id="console-overlay-toggle" style="position: fixed; bottom: 220px; right: 10px; width: 40px; height: 40px; background: #0f0; color: #222; border: none; border-radius: 50%; font-size: 20px; font-weight: bold; z-index: 10000; cursor: pointer;">🖥️</button>
    <div style="position: fixed; top: 10px; left: 10px; background: lime; color: black; padding: 10px; font-weight: bold; z-index: 10000; border-radius: 4px; display: none;" id="app-loaded-indicator">✅ APP CARREGADO</div>
    <script>
      const consoleOverlay = document.getElementById('console-overlay');
      const toggleBtn = document.getElementById('console-overlay-toggle');
      const originalLog = console.log;
      const originalError = console.error;
      const originalDebug = console.debug;
      const originalWarn = console.warn;
      let lines = [];
      function addLine(type, msg) {
        lines.push(`[${type}] ${msg}`);
        if (lines.length > 25) lines.shift();
        consoleOverlay.innerHTML = lines.map(l => '<div>' + l + '</div>').join('');
        if (lines.length > 0) consoleOverlay.style.display = 'block';
      }
      console.log = function(...args) {
        originalLog.apply(console, args);
        addLine('LOG', args.join(' '));
      };
      console.debug = function(...args) {
        originalDebug.apply(console, args);
        addLine('DBG', args.join(' '));
      };
      console.error = function(...args) {
        originalError.apply(console, args);
        addLine('ERR', args.join(' '));
      };
      console.warn = function(...args) {
        originalWarn.apply(console, args);
        addLine('WRN', args.join(' '));
      };
      window.clearConsoleOverlay = () => {
        lines = [];
        consoleOverlay.innerHTML = '';
        consoleOverlay.style.display = 'none';
      };
      window.exportConsoleOverlay = () => {
        const text = lines.join('\n');
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'console-logs.txt';
        a.click();
      };
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          consoleOverlay.style.display = 'none';
        }
        if (e.ctrlKey && e.shiftKey && e.key === 'L') {
          consoleOverlay.style.display =
            consoleOverlay.style.display === 'none' ? 'block' : 'none';
        }
      });
      toggleBtn.addEventListener('click', () => {
        consoleOverlay.style.display =
          consoleOverlay.style.display === 'none' ? 'block' : 'none';
      });
      // Exibe overlay por padrão ao carregar
      window.addEventListener('load', () => {
        document.getElementById('app-loaded-indicator').style.display = 'block';
        consoleOverlay.style.display = 'block';
      });
      console.log('✅ Console overlay ativado');
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
