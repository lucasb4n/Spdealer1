# ============================================================================
# NGINX Configuration - SPDealer com Cloudflare + HTTPS
# Domínio: spdealer.seprocom.com.br
# Autenticação: Cloudflare
# Protocolo: HTTPS (via Cloudflare)
# ============================================================================

# ============================================================================
# Upstream Backends
# ============================================================================

upstream spdealer_backend {
    # Spring Boot Backend
    server 192.168.10.70:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream spdealer_frontend {
    # React Frontend
    server 192.168.10.70:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream spdealer_socket {
    # Socket.IO Server (Notifications)
    server 192.168.10.30:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ============================================================================
# HTTP Redirect to HTTPS (Cloudflare handles SSL)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name spdealer.seprocom.com.br www.spdealer.seprocom.com.br;

    # Trust Cloudflare headers
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/12;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================================================
# HTTPS Server (Main - Cloudflare SSL)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name spdealer.seprocom.com.br www.spdealer.seprocom.com.br;

    # ====================================================================
    # Trust Cloudflare Proxy
    # ====================================================================
    
    # Real IP from Cloudflare
    real_ip_header CF-Connecting-IP;
    
    # Cloudflare IP ranges (updated periodically)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/12;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Logging
    access_log /var/log/nginx/spdealer_access.log combined;
    error_log /var/log/nginx/spdealer_error.log warn;

    # Security Headers (Cloudflare handles SSL)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https: wss: ws:;" always;

    # Client upload limit
    client_max_body_size 50M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ====================================================================
    # Frontend (React) - Root Path /
    # ====================================================================

    location / {
        proxy_pass http://spdealer_frontend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Cloudflare headers
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Country $http_cf_ipcountry;

        # Cache bypass for development
        proxy_cache_bypass $http_upgrade;
    }

    # ====================================================================
    # Backend API - /api paths
    # ====================================================================

    location ~ ^/api/ {
        proxy_pass http://spdealer_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cloudflare headers
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Country $http_cf_ipcountry;

        # Keep connections alive
        proxy_set_header Connection "";

        # Rewrite redirect headers
        proxy_redirect http://localhost:8080/api/ https://$server_name/api/;
        proxy_redirect http://192.168.10.70:8080/api/ https://$server_name/api/;
    }

    # ====================================================================
    # Socket.IO - Real-time Notifications
    # ====================================================================

    location /socket.io/ {
        proxy_pass http://spdealer_socket;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare headers
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Country $http_cf_ipcountry;

        # Socket.IO specific
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ====================================================================
    # WebSocket Support (Alternative socket endpoint)
    # ====================================================================

    location /ws {
        proxy_pass http://spdealer_socket;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ====================================================================
    # Health Check Endpoint
    # ====================================================================

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ====================================================================
    # Cloudflare Health Check
    # ====================================================================

    location /cf-check {
        access_log off;
        return 200 "Cloudflare OK\n";
        add_header Content-Type text/plain;
    }

    # ====================================================================
    # Static Assets (Caching)
    # ====================================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ====================================================================
    # Deny access to sensitive files
    # ====================================================================

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.well-known {
        allow all;
    }

    # ====================================================================
    # Monitoring/Admin endpoints (private)
    # ====================================================================

    location ~ ^/(admin|monitoring) {
        # Restrict to internal IPs
        allow 192.168.0.0/16;
        allow 100.126.0.0/16;
        deny all;
    }

}

# ============================================================================
# Gzip Compression
# ============================================================================

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
gzip_disable "msie6";

# ============================================================================
# Rate Limiting (DDoS Protection via Cloudflare)
# ============================================================================

# NOTE: Cloudflare provides rate limiting at the edge
# Configure rate rules in Cloudflare Dashboard → Security → Rate limiting

# Local rate limiting as fallback
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=socket:10m rate=500r/s;

# ============================================================================
# Upstream keepalive
# ============================================================================

keepalive_timeout 65;
keepalive_requests 100;
