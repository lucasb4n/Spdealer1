## ============================================================
# PROFILE: LOCAL (desenvolvimento/testes)
# Ambiente: localhost
## ============================================================

# Configuração do Banco de Dados - REMOTO
spring.datasource.url=jdbc:mariadb://localhost:3306/erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=k15720
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# HikariCP - configurações mais leves para dev
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Server Port and context
server.port=8080

# RTC / Calculadora (proxy interno: /api/rtc/calculadora/regime-geral)
# Aponte para a calculadora RTC (local/homolog/prod).
# IMPORTANTE (DEV): o backend do SPDealer ja usa :8080, entao rode a calculadora em outra porta no host.
# Recomendado via Docker: mapear 18081 -> 8081 e configurar:
# rtc.calculadora.base-url=http://localhost:18081
# Exemplo gov.br (ajuste conforme endpoint oficial):
# rtc.calculadora.base-url=https://consumo.tributos.gov.br
# Se você quiser rodar com context-path /spdealer, descomente abaixo e use
# --server.servlet.context-path=/spdealer ao iniciar, ou defina aqui
#server.servlet.context-path=/spdealer

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# CORS (apenas localhost durante dev)
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# Frontend URL (dev)
app.frontend-url=http://localhost:3000

# Logging
logging.level.root=INFO
logging.level.br.com.spdealer=DEBUG
logging.level.org.springframework.web=INFO
