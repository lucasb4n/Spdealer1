# Configuração do Banco de Dados - PRODUÇÃO
spring.datasource.url=jdbc:mariadb://100.126.166.63:3306/erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=spdealer_user
spring.datasource.password=SpD3al3r@2025!
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Desabilita validacao de schema (o banco nao e 100% compativel com entidades)
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.jpa.compliance.global_id=false

# Otimizações de performance (produção)
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_sql_comments=false

# HikariCP Connection Pool - Mais agressivo para produção
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true

# Server Port
server.port=5070

# Session Cookie Configuration (Crucial for HTTPS behind Proxy)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# RTC / Calculadora (proxy interno: /api/rtc/calculadora/regime-geral)
# Defina para o endpoint oficial/homologacao quando estiver disponivel.
# rtc.calculadora.base-url=https://consumo.tributos.gov.br
server.address=0.0.0.0

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# CORS Configuration - Produção (Cloudflare + rede local + cliente + tailscale)
app.cors.allowed-origins=https://spdealer.seprocom.com.br,http://spdealer.seprocom.com.br,http://192.168.10.70:5070,http://192.168.1.10:5070,http://100.126.166.63:5070,http://localhost:3000,http://localhost:5070,http://127.0.0.1:3000,http://127.0.0.1:5070,http://100.126.166.63:3000,http://192.168.10.100:3000,http://192.168.10.100:5070
