<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPDealer - Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .main-header { background: #007bff; color: #fff; padding: 20px 30px; border-radius: 0 0 12px 12px; }
        .sidebar { height: 100vh; background: linear-gradient(135deg, #2c3e50, #4a6741); color: #fff; padding: 0; position: fixed; top: 0; left: 0; width: 250px; overflow-y: auto; }
        .main-content { margin-left: 250px; padding: 30px; }
        .user-info { background: #1a252f; color: #ecf0f1; padding: 15px 20px; font-size: 15px; border-bottom: 1px solid #34495e; }
        .navbar-brand { color: #fff !important; font-weight: bold; padding: 15px 20px; background: #1a252f; margin: 0; text-align: center; }
        .sidebar .nav-link { color: #ecf0f1; padding: 12px 16px; border-bottom: 1px solid #34495e; display:flex; align-items:center; gap:12px; justify-content:flex-start; text-align:left; }
        .sidebar .nav-link:hover { background: #34495e; color: #fff; }
        .sidebar .nav-link.active { background: #3498db; color: #fff; }
        .sidebar .mt-auto { margin-top: auto; }
    </style>
</head>
<body>
    <!-- Cabeçalho -->
    <div class="main-header d-flex align-items-center justify-content-between">
        <div>
            <i class="fas fa-car fa-lg me-2"></i> <span class="fw-bold">SPDealer</span>
        </div>
        <div>
            <span th:text="${usuario}"></span> <span class="badge bg-light text-dark ms-2" th:text="${cargo}"></span>
            <a href="/logout" class="btn btn-danger ms-4">Sair</a>
        </div>
    </div>
    <!-- Menu lateral -->
    <div class="sidebar">
        <div class="navbar-brand">
            <i class="fas fa-car"></i> SPDealer
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i> <strong th:text="${usuario}">Usuário</strong><br>
            <small th:text="${cargo}">Cargo</small>
        </div>
        <nav class="nav flex-column" id="menu-dynamic-area">
            <!-- Menu dinâmico será renderizado aqui -->
        </nav>
        <div class="mt-auto">
            <a href="/logout" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </div>
    </div>
    <!-- Área central -->
    <div class="main-content" id="main-content-area">
        <!-- Dashboard dinâmico será renderizado aqui -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/templates/menu-dynamic.js"></script>
    <script src="/templates/dashboard-dynamic.js"></script>
</body>
</html>
