<!-- Formulário de cadastro de usuários -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Cadastro de Usuário</h2>
    <form id="formUserRegister" class="mb-3">
        <div class="row">
            <div class="col-md-3">
                <input type="text" class="form-control" name="username" placeholder="Login" required>
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" name="name" placeholder="Nome Completo" required>
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" name="role" placeholder="Cargo">
            </div>
            <div class="col-md-2">
                <input type="password" class="form-control" name="password" placeholder="Senha" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success">Cadastrar</button>
            </div>
        </div>
    </form>
    <div id="userMenuPermission">
        <!-- Componente de lista dinâmica para vincular permissões de menu -->
    </div>
    <ul id="userList" class="list-group mt-3">
        <!-- Usuários renderizados dinamicamente -->
    </ul>
</div>
<script src="/static/user-register.js"></script>
</body>
</html>
